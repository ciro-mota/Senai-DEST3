{% extends 'global/base.html' %}

{% block title %}Excluir equipamento{% endblock %}

{% block content %}
<h1>Confirmar exclusão</h1>

<div class="card" style="max-width:500px; padding: 16px 20px">
  <p>Deseja realmente excluir o equipamento <strong>{{ object.nome }}</strong>?</p>
  <form method="post" style="display:inline">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Excluir</button>
  </form>
  <a class="btn btn-outline-secondary" href="{% url 'colaboradores:equipamento_lista' %}">Cancelar</a>
</div>
{% endblock %}
