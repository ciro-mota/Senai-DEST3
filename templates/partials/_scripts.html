<script>
  function toggleDevolucao(){
    const sel = document.querySelector('[name="status"]');
    if(!sel) return;
    const status = sel.value;
    const show = ['devolvido','danificado','perdido'].includes(status);
    const container = document.getElementById('devolucao-fields');
    if(container) container.style.display = show ? 'block' : 'none';
  }
  document.addEventListener('DOMContentLoaded', function(){
    const sel = document.querySelector('[name="status"]');
    if(sel){ sel.addEventListener('change', toggleDevolucao); toggleDevolucao(); }
  });
</script>
