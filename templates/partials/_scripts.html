<script>
  (function(){
    const STORAGE_KEY = 'theme';
    const root = document.documentElement;

    function applyTheme(theme){
      if(theme !== 'light' && theme !== 'dark') return;
      root.setAttribute('data-theme', theme);
      try { localStorage.setItem(STORAGE_KEY, theme); } catch(e) {}
    }

    function initTheme(){
      let saved = null;
      try { saved = localStorage.getItem(STORAGE_KEY); } catch(e) {}
      if(saved === 'light' || saved === 'dark') {
        applyTheme(saved);
      } else {
        applyTheme('light');
      }
    }

    function wireThemeToggle(){
      const btn = document.getElementById('theme-toggle');
      if(!btn) return;
      btn.addEventListener('click', function(){
        const current = root.getAttribute('data-theme') || 'light';
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });
    }

    document.addEventListener('DOMContentLoaded', function(){
      initTheme();
      wireThemeToggle();
    });
  })();

  function toggleDevolucao(){
    const container = document.getElementById('devolucao-fields');
    if(!container) return;
    const form = container.closest('form') || document;
    const sel = form.querySelector('select[name="status"], [name="status"]');
    if(!sel) return;
    const status = sel.value;
    const show = ['devolvido','danificado','perdido'].includes(status);
    container.style.display = show ? 'block' : 'none';
  }
  document.addEventListener('DOMContentLoaded', function(){
    const container = document.getElementById('devolucao-fields');
    const form = container ? (container.closest('form') || document) : document;
    const sel = form.querySelector('select[name="status"], [name="status"]');
    if(sel){ sel.addEventListener('change', toggleDevolucao); }
    toggleDevolucao();
  });
</script>
