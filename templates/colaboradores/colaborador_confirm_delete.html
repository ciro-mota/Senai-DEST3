{% extends 'base.html' %}

{% block title %}Excluir colaborador{% endblock %}

{% block content %}
<h1>Confirmar exclusão</h1>
<p>Deseja realmente excluir o colaborador <strong>{{ object.nome }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Excluir</button>
    <a href="{% url 'colaboradores:lista' %}">Cancelar</a>
</form>
{% endblock %}
