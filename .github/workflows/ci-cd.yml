name: CI-CD Pipeline

permissions:
  contents: write
  id-token: write
  packages: write
  security-events: write

on:
  push:
    paths:
     - 'Dockerfile'
  workflow_dispatch:
    inputs:
      manual_commit_message:
        description: "Insert manual commit message"
        type: string
        required: true

jobs:
  build-test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check

      - name: Django system check
        run: uv run python manage.py check

      - name: Build Docker image
        run: docker build -t projeto-final:${{ github.sha }} .

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/projeto-final:latest
            ghcr.io/${{ github.repository_owner }}/projeto-final:${{ github.sha }}
